foundation_gates:
  R1-G01:
    title: Identity
    requirement: stable object identity across canonical and derived/external representations
  R1-G02:
    title: Authority
    requirement: proposal-confirm-lock boundaries survive adversarial tests
  R1-G03:
    title: Dependency
    requirement: upstream changes stale only affected downstream artifacts and support local rebuild
  R1-G04:
    title: Geometry
    requirement: representative topology and geometry failure cases fail closed
  R1-G05:
    title: Delivery
    requirement: third-party semantic round-trip plus real profile subset
  R1-G06:
    title: Preview
    requirement: proposal previews cannot mutate canonical current state
  R1-G07:
    title: Real Case
    requirement: at least one non-pure-synthetic site sketch traverses the main vertical slice
  R1-G08:
    title: Architecture Spikes
    requirement: IFC, independent environment engine, and real project profile have bounded successful spikes
