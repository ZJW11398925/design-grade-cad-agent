schema_id: dgcad.e2e.adversarial.v0.1
status: living_contract
scope: e2e_003
promotion_date: 2026-10-27
purpose: "Turn known DXF delivery failure modes into repeatable CI evidence without silently accepting them."

issue_categories:
  cad_format_semantics:
    description: "Entity/geometry semantics defined by the DXF format."
    codes:
      - DXF_VERSION_MISMATCH
      - UNITS_MISMATCH
      - ENTITY_TYPE_MISMATCH
      - COORDINATE_MISMATCH
      - CLOSED_MISMATCH
      - NONZERO_Z
      - CIRCLE_NONZERO_Z
      - TEXT_NONZERO_Z
      - CIRCLE_MISMATCH
      - TEXT_MISMATCH
      - BULGE_MISMATCH
      - VERTEX_WIDTH_MISMATCH
      - CONST_WIDTH_MISMATCH
      - THICKNESS_MISMATCH
      - EXTRUSION_MISMATCH
      - AUDIT_ERROR
  interoperability:
    description: "Identity/provenance mismatch between CAD-IR and the written DXF."
    codes:
      - MISSING_XDATA
      - UNEXPECTED_ENTITY
      - MISSING_ENTITY
      - OBJECT_CLASS_MISMATCH
      - REVISION_MISMATCH
      - SOURCE_HASH_MISMATCH
      - REP_HASH_MISMATCH
      - RING_ROLE_MISMATCH
  profile_violation:
    description: "Violation of the declared delivery profile, layer or entity-style policy."
    codes:
      - LAYER_MISSING
      - UNEXPECTED_LAYER
      - LAYER_PROPERTY_MISMATCH
      - LAYER_MISMATCH
      - ENTITY_COLOR_OVERRIDE
      - ENTITY_LINETYPE_OVERRIDE
      - ENTITY_LINEWEIGHT_OVERRIDE
      - ENTITY_TRUE_COLOR_OVERRIDE
      - ENTITY_TRANSPARENCY_OVERRIDE
      - TEXT_ROTATION_MISMATCH
      - TEXT_WIDTH_MISMATCH
      - TEXT_ALIGNMENT_MISMATCH
  serialization_difference:
    description: "Serialization normalization that is not a design failure."
    codes:
      - AUDIT_FIX
  validator_error:
    description: "The validator itself could not complete; never a design pass or fail conclusion."
    codes:
      - VALIDATOR_ERROR
  unclassified:
    description: "A new code not yet added to the classification contract. Visible by design; must be resolved."
    codes: []

scenarios:
  - id: LWPOLYLINE_ELEVATION
    group: geometry
    expected: detected
    code: NONZERO_Z
    test: test_lwpolyline_elevation_is_detected
    issue: null
  - id: CIRCLE_NONZERO_Z
    group: geometry
    expected: detected
    code: CIRCLE_NONZERO_Z
    test: test_circle_nonzero_z_is_detected
    issue: "#18"
  - id: TEXT_NONZERO_Z
    group: geometry
    expected: detected
    code: TEXT_NONZERO_Z
    test: test_text_nonzero_z_is_detected
    issue: "#18"
  - id: TEXT_ROTATION
    group: text
    expected: detected
    code: TEXT_ROTATION_MISMATCH
    test: test_text_rotation_is_detected
    issue: "#18"
  - id: TEXT_WIDTH_ALIGNMENT
    group: text
    expected: detected
    codes: [TEXT_WIDTH_MISMATCH, TEXT_ALIGNMENT_MISMATCH]
    test: test_text_width_and_alignment_are_detected
    issue: "#18"
  - id: ENTITY_COLOR_OVERRIDE
    group: style
    expected: detected
    code: ENTITY_COLOR_OVERRIDE
    test: test_entity_style_override_is_detected[color]
    issue: "#17"
  - id: ENTITY_LINETYPE_OVERRIDE
    group: style
    expected: detected
    code: ENTITY_LINETYPE_OVERRIDE
    test: test_entity_style_override_is_detected[linetype]
    issue: "#17"
  - id: ENTITY_LINEWEIGHT_OVERRIDE
    group: style
    expected: detected
    code: ENTITY_LINEWEIGHT_OVERRIDE
    test: test_entity_style_override_is_detected[lineweight]
    issue: "#17"
  - id: ENTITY_TRUE_COLOR_OVERRIDE
    group: style
    expected: detected
    code: ENTITY_TRUE_COLOR_OVERRIDE
    test: test_entity_style_override_is_detected[true_color]
    issue: "#17"
  - id: ENTITY_TRANSPARENCY_OVERRIDE
    group: style
    expected: detected
    code: ENTITY_TRANSPARENCY_OVERRIDE
    test: test_entity_style_override_is_detected[transparency]
    issue: "#17"
  - id: LWPOLYLINE_START_END_WIDTH
    group: geometry
    expected: detected
    code: VERTEX_WIDTH_MISMATCH
    test: test_lwpolyline_start_end_width_is_detected
    issue: "#3"
  - id: LWPOLYLINE_THICKNESS
    group: geometry
    expected: detected
    code: THICKNESS_MISMATCH
    test: test_lwpolyline_thickness_is_detected
    issue: "#3"
  - id: LWPOLYLINE_EXTRUSION
    group: geometry
    expected: detected
    code: EXTRUSION_MISMATCH
    test: test_lwpolyline_extrusion_is_detected
    issue: "#3"
  - id: MULTIPOLYGON_TWO_PARTS_HOLE
    group: geometry
    expected: pass
    test: test_multipolygon_two_parts_and_hole_roundtrip
    issue: null
    notes: "ring_index is global within the object (part order, then ring order); stable ring identity across revisions is a Milestone 3 decision."
  - id: SYMBOL_TABLE_CASE
    group: serialization
    expected: pass
    test: test_symbol_table_name_case_is_semantically_equal
    issue: null
  - id: MISSING_XDATA
    group: identity
    expected: detected
    code: MISSING_XDATA
    test: test_missing_xdata_is_structured
    issue: null
  - id: VALIDATOR_ERROR_STRUCTURED
    group: validator
    expected: detected
    code: VALIDATOR_ERROR
    test: test_validator_error_is_structured
    issue: "#7"

existing_coverage:
  - id: VERTEX_MUTATION
    test: test_readback_detects_vertex_mutation
    file: tests/test_cad_delivery_contracts.py
    code: COORDINATE_MISMATCH
    status: positive
  - id: UNEXPECTED_LAYER
    test: test_readback_detects_unexpected_layer
    file: tests/test_cad_delivery_contracts.py
    code: UNEXPECTED_LAYER
    status: positive
  - id: ENTITY_TYPE_SUBSTITUTION
    test: test_readback_detects_entity_type_substitution_without_crashing
    file: tests/test_cad_delivery_contracts.py
    code: ENTITY_TYPE_MISMATCH
    status: positive
  - id: BULGE
    test: test_bulge_mutation_is_detected
    file: tests/test_cad_delivery_contracts.py
    code: BULGE_MISMATCH
    status: positive
  - id: CONSTANT_WIDTH
    test: test_constant_width_mutation_is_detected
    file: tests/test_cad_delivery_contracts.py
    code: CONST_WIDTH_MISMATCH
    status: positive

boundaries:
  modelspace_only: true
  paper_space: out_of_scope
  third_party_roundtrip: not_claimed
  same_library_readback_only: true
  dev_cad_scope: "3a fixes only (003/007/009/010); 001/004/005/006/008/011 remain open"
  road_surface_geometry: deferred
  real_sketch_input: out_of_scope
  ifc: out_of_scope

completion_rule: "Every scenario is detected or passes as a positive case. No strict xfail remains in Milestone 3a."
