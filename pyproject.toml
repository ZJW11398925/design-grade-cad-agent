[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgcad"
version = "0.1.0"
description = "Research-first workspace for a traceable sketch -> professional site model -> CAD/BIM agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DGCAD contributors" }]
keywords = ["cad", "bim", "dxf", "ifc", "site-planning", "agent", "mcp", "geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/ZJW11398925/design-grade-cad-agent"
Repository = "https://github.com/ZJW11398925/design-grade-cad-agent"
Issues = "https://github.com/ZJW11398925/design-grade-cad-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dgcad_*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["dgcad_foundation", "dgcad_runtime", "dgcad_deployment"]

[tool.coverage.report]
show_missing = true
skip_covered = true
