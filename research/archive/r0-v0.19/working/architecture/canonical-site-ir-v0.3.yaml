schema_id: design-grade-cad-agent.canonical-site-ir.v0.3
status: provisional_after_architecture_challenge

principles:
  canonical_truth_owner: canonical_site_model
  source_and_trace_are_immutable_evidence: true
  delivery_artifacts_are_derived: true
  external_artifacts_never_overwrite_canonical_directly: true
  agent_direct_confirmed_write: false
  preview_world_isolated_from_current_world: true

scene:
  required: [scene_id, scene_revision, coordinate_frame_ref, dependency_graph_revision]
  scene_id: required
  scene_revision: required
  coordinate_frame_ref: required
  project_profile_bindings: []
  active_rule_bindings: []
  dependency_graph_revision: required

base_object:
  required:
    - object_id
    - object_class
    - semantic_revision
    - geometry_revision
    - parameter_revision
    - authority_state
    - lifecycle_state
    - provenance
  authority_state:
    enum: [evidence_only, candidate, rule_derived, human_confirmed, locked]
  lifecycle_state:
    enum: [current, rejected, blocked]
  locks: []
  source_refs: []
  trace_ref: nullable
  provenance:
    created_by: required
    parent_objects: []
    change_set_ref: nullable
    change_proposal_ref: nullable
    change_reason: nullable
    evidence_refs: []
    rule_refs: []
    validator_refs: []

geometry_record:
  required: [geometry_id, geometry_type, coordinate_frame_ref, revision, geometry_hash]
  geometry_id: required
  geometry_type: required
  coordinate_frame_ref: required
  revision: required
  geometry_hash: required
  z_policy:
    enum: [planar_zero, explicit_z, derived_z, unknown]
  topology_summary:
    component_count: required
    hole_count: required
    valid: required
  diff_from_trace: nullable

road_object:
  inherits: base_object
  fields:
    graph_node_refs: []
    graph_edge_refs: []
    hierarchy:
      value: nullable
      state: {enum: [unknown, proposed, confirmed]}
      evidence_refs: []
    functions: []
    special_uses: []
    centerline_geometry_ref: nullable
    alignment_state: {enum: [trace_only, candidate, confirmed, blocked]}
    cross_section_profile_ref: nullable
    junction_refs: []
    design_profile_ref: nullable

building_object:
  inherits: base_object
  fields:
    trace_footprint_ref: nullable
    professional_footprint_ref: nullable
    regularization_state:
      enum: [not_run, preserve_trace, candidate, needs_review, confirmed]
    typology:
      value: nullable
      state: {enum: [unknown, proposed, confirmed]}
    height:
      value_m: nullable
      state: {enum: [unknown, estimated, proposed, confirmed]}
      source_ref: nullable
    floors:
      value: nullable
      state: {enum: [unknown, estimated, proposed, confirmed]}
      source_ref: nullable
    base_elevation_m: nullable
    massing_representation_ref: nullable
    adjacency_refs: []

landscape_object:
  inherits: base_object
  fields:
    landscape_role: nullable
    surface_geometry_ref: nullable

change_proposal:
  required:
    - proposal_id
    - target_object_ids
    - operation_type
    - before_revisions
    - candidate_after
    - required_authority
  proposal_id: required
  target_object_ids: []
  operation_type: required
  before_revisions: []
  candidate_after: required
  reason: required
  evidence_refs: []
  rule_refs: []
  expected_side_effects: []
  required_authority:
    enum: [deterministic_auto, human_confirm, human_unlock, blocked]
  proposal_state:
    enum: [draft, validated, awaiting_confirmation, accepted, rejected, superseded]

change_set:
  required: [change_set_id, proposal_refs, transaction_scope, commit_policy, state]
  change_set_id: required
  proposal_refs: []
  transaction_scope: []
  invariant_checks: []
  commit_policy:
    enum: [all_or_nothing]
  state:
    enum: [draft, previewed, validated, awaiting_confirmation, committed, rejected]

proposal_snapshot:
  required: [snapshot_id, base_scene_revision, change_set_ref, preview_hash, state]
  snapshot_id: required
  base_scene_revision: required
  change_set_ref: required
  applied_candidate_changes: []
  preview_hash: required
  state:
    enum: [preview_only, superseded, discarded]

rule_resolution:
  required: [resolution_id, rule_ref, applicability]
  resolution_id: required
  rule_ref: required
  applicability:
    enum: [applicable, conditionally_applicable, not_applicable, blocked]
  prerequisites: []
  missing_prerequisites: []
  resolved_parameters: {}
  override_chain: []

representation:
  required:
    - representation_id
    - representation_type
    - world
    - dependency_hash
    - method_id
    - method_version
    - state
  representation_id: required
  representation_type:
    enum: [trace, professional_2d, massing_3d, road_surface, cad_dxf, bim_ifc, analysis_mesh, rendering]
  world:
    enum: [canonical_current, proposal_preview, external]
  object_id: nullable
  proposal_snapshot_ref: nullable
  source_revisions:
    semantic_revision: nullable
    geometry_revision: nullable
    parameter_revision: nullable
  method_id: required
  method_version: required
  profile_bindings: []
  dependency_hash: required
  state:
    enum: [current, preview_only, stale, invalid, blocked, external_unreconciled]

analysis_result:
  required: [analysis_id, analysis_type, world, dependency_hash, method_id, method_version, result_state]
  analysis_id: required
  analysis_type: required
  world:
    enum: [canonical_current, proposal_preview]
  dependency_hash: required
  input_object_revisions: []
  input_context_refs: []
  method_id: required
  method_version: required
  coverage_limits: []
  result_state:
    enum: [provisional, confirmed_for_scope, preview_only, stale, blocked]

dependency_node:
  node_types:
    - object_revision
    - calibration_revision
    - profile_revision
    - rule_revision
    - method_version
    - context_revision
    - terrain_revision
    - sensor_grid_revision
    - delivery_profile_revision
  required: [node_id, node_type, revision_or_hash]
  node_id: required
  node_type: required
  revision_or_hash: required

dependency_edge:
  required: [upstream_node_ref, downstream_artifact_ref, invalidation_policy]
  upstream_node_ref: required
  downstream_artifact_ref: required
  invalidation_policy:
    enum: [mark_stale, block, rebuild_required]

validation_result:
  required: [validator_id, validator_version, scope, world, verdict, issues]
  validator_id: required
  validator_version: required
  scope: required
  world:
    enum: [canonical_current, proposal_preview, external]
  verdict:
    enum: [pass, pass_with_differences, conditional, fail, unsupported, validator_error]
  issues:
    - code: required
      severity: required
      object_id: nullable
      expected: nullable
      actual: nullable
      evidence_locator: nullable
      fixability: nullable
  coverage_limits: []

external_reconcile:
  required: [external_artifact_ref, comparison_result, proposal_refs]
  external_artifact_ref: required
  comparison_result: required
  proposal_refs: []
  direct_canonical_write_allowed: false
