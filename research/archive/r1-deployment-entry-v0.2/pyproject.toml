[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgcad-deployment-entry-research"
version = "0.2.0"
description = "Research prototype for Design-Grade CAD deployment boundary and local sidecar persistence"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
